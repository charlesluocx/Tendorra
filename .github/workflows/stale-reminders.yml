name: Stale-project reminders

on:
  schedule:
    # Hourly; the route itself only actually emails once per project per
    # REMINDER_COOLDOWN_HOURS, so running more often than that is harmless.
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Call the stale-reminders endpoint
        run: |
          if [ -z "${{ vars.APP_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "APP_URL repo variable or CRON_SECRET repo secret not set — skipping." >&2
            exit 1
          fi
          curl --fail-with-body -sS -X POST "${{ vars.APP_URL }}/api/cron/stale-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
